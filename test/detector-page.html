<!doctype html>
<meta charset="utf-8">
<title>Still Here detector harness</title>
<style>body{font:14px ui-monospace,monospace;padding:16px}.bad{color:#c00}.ok{color:#080}</style>
<h1>Detector harness</h1>
<p>Switch tabs / click away, then come back. With the extension on, nothing below should log a leak.</p>
<pre id="state"></pre>
<pre id="log"></pre>
<script>
const log = (m) => { document.getElementById('log').textContent += m + '\n'; window.__leaks = (window.__leaks || []).concat(m); };
for (const t of ['blur','focus','visibilitychange','freeze','resume']) {
  window.addEventListener(t, () => log('LEAK window ' + t));
  document.addEventListener(t, () => log('LEAK document ' + t));
}
window.onblur = () => log('LEAK window.onblur');
function render() {
  const rows = {
    'document.hidden': document.hidden,
    'document.visibilityState': document.visibilityState,
    'document.hasFocus()': document.hasFocus(),
  };
  document.getElementById('state').textContent = Object.entries(rows).map(([k, v]) => k + ' = ' + v).join('\n');
  window.__state = rows;
}
setInterval(render, 250); render();
// stealth probes
const g = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden').get;
log('probe get hidden toString: ' + g.toString());
log('probe own props on document: ' + Object.getOwnPropertyNames(document).join(',') );
log('probe Function.prototype.toString: ' + Function.prototype.toString.toString());
// synthetic events must still pass through
let synthetic = false;
document.addEventListener('visibilitychange', () => { synthetic = true; }, { once: true });
document.dispatchEvent(new Event('visibilitychange'));
log('synthetic visibilitychange delivered: ' + synthetic);
</script>
